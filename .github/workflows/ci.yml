name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
          cache: npm
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Install exact tested host SDK
        run: npm install --no-save --package-lock=false --ignore-scripts --legacy-peer-deps openclaw@2026.10.5
      - run: npm run typecheck
      - run: npm test
      - run: npm run plugin:build:check
      - run: npm run plugin:validate
      - run: npm run package:check
      - run: npm audit --omit=dev --audit-level=high
